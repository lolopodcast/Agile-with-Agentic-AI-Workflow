const LabCard = ({ title, desc, children }) => (
  <div className="bg-white dark:bg-slate-800 rounded-xl p-4 sm:p-6 border border-slate-200 dark:border-slate-700">
    <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{title}</h3>
    <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{desc}</p>
    {children}
  </div>
);

const ProcessSimLab = ({ t }) => {
  const [stage, setStage] = useState(0);
  const [decision, setDecision] = useState({});
  const [msg, setMsg] = useState('');
  const gate = t.sim_gates.find(g => g.stage === stage);
  const decided = gate ? decision[stage] : true;
  const correctN = t.sim_gates.filter(g => decision[g.stage] === g.correct).length;
  const decide = (choice) => {
    setDecision(d => ({ ...d, [stage]: choice }));
    setMsg(choice === gate.correct ? `${t.sim_correct} ${gate.fb}` : `${t.sim_wrong} ${gate.fb}`);
  };
  const next = () => {
    setMsg('');
    if (gate && decision[stage] === 'fail' && stage === 3) { setStage(2); setMsg(t.sim_returned); return; }
    if (stage === 5) { setStage(0); setMsg(t.sim_loop_done); return; }
    setStage(stage + 1);
  };
  return (
    <LabCard title={t.mlab_labs[0].title} desc={t.mlab_labs[0].desc}>
      <div className="flex flex-wrap gap-2 mb-4">
        {t.stage_names.map((s, i) => (
          <span key={i} className={`px-3 py-1 rounded-full text-xs font-bold border ${i === stage ? 'bg-[#004030] text-white dark:bg-[#D8C3A5] dark:text-[#004030] border-transparent' : 'border-slate-300 dark:border-slate-600 text-slate-500'}`}>{i + 1}. {s}</span>
        ))}
      </div>
      <p className="text-sm mb-3"><strong>{stage + 1}. {t.stage_names[stage]}</strong> — {t.sim_stage_desc[stage]}</p>
      {gate && (
        <div className="p-4 rounded-lg bg-[#D8C3A5]/30 dark:bg-[#D8C3A5]/10 border border-[#D8C3A5] mb-3">
          <p className="text-sm font-bold text-[#004030] dark:text-[#D8C3A5]">{gate.gate}</p>
          <p className="text-sm mt-1">{gate.scenario}</p>
          <div className="flex gap-2 mt-3">
            <button disabled={!!decision[stage]} onClick={() => decide('pass')} className="px-4 py-1.5 text-sm rounded-lg bg-green-700 text-white disabled:opacity-40">{t.sim_pass}</button>
            <button disabled={!!decision[stage]} onClick={() => decide('fail')} className="px-4 py-1.5 text-sm rounded-lg bg-red-700 text-white disabled:opacity-40">{t.sim_fail}</button>
          </div>
        </div>
      )}
      {msg && <p className="text-sm italic text-slate-600 dark:text-slate-300 mb-3">{msg}</p>}
      <div className="flex items-center gap-3 flex-wrap">
        <button disabled={!decided} onClick={next} className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.sim_next}</button>
        <button onClick={() => { setStage(0); setDecision({}); setMsg(''); }} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg">{t.sim_restart}</button>
        <span className="text-sm text-slate-500">{t.sim_score.replace('{n}', correctN)}</span>
      </div>
    </LabCard>
  );
};

const RACI_REF = [['A','I','C','R','C'],['A','R','C','R','I'],['I','A','C','R','—'],['I','C','A','R','—'],['A','I','C','R','C'],['C','A','C','R','—']];
const RACI_CYCLE = ['—','R','A','C','I'];
const RaciLab = ({ t }) => {
  const blank = () => Array(6).fill(0).map(() => Array(5).fill('—'));
  const [grid, setGrid] = useState(blank);
  const [result, setResult] = useState(null);
  const [showRef, setShowRef] = useState(false);
  const cycle = (i, j) => { setResult(null); setGrid(g => g.map((row, a) => row.map((c, b) => (a === i && b === j) ? RACI_CYCLE[(RACI_CYCLE.indexOf(c) + 1) % 5] : c))); };
  const check = () => {
    const errs = [];
    grid.forEach((row, i) => {
      const name = `${i + 1}. ${t.stage_names[i]}`;
      if (row[3] === 'A' || row[4] === 'A') errs.push(t.raci_err_agentA.replace('{stage}', name));
      else if (row.filter(c => c === 'A').length !== 1) errs.push(t.raci_err_oneA.replace('{stage}', name));
    });
    let n = 0; grid.forEach((row, i) => row.forEach((c, j) => { if (c === RACI_REF[i][j]) n++; }));
    setResult({ errs, n });
  };
  const cellCls = (c) => c === 'A' ? 'bg-[#004030] text-white dark:bg-[#D8C3A5] dark:text-[#004030]' : c === 'R' ? 'bg-[#D8C3A5] text-[#004030] dark:bg-[#004030] dark:text-white' : c === 'C' ? 'bg-slate-200 dark:bg-slate-600' : c === 'I' ? 'bg-slate-100 dark:bg-slate-700' : 'text-slate-400';
  const show = showRef ? RACI_REF : grid;
  return (
    <LabCard title={t.mlab_labs[1].title} desc={t.mlab_labs[1].desc}>
      <p className="text-xs text-slate-500 mb-2">{t.raci_hint}</p>
      <div className="overflow-x-auto">
        <table className="w-full text-sm border-collapse min-w-[460px]">
          <thead><tr><th className="text-left p-2"></th>{t.raci_roles.map((r, j) => <th key={j} className="p-2 text-xs text-[#004030] dark:text-[#D8C3A5]">{r}</th>)}</tr></thead>
          <tbody>{show.map((row, i) => (
            <tr key={i} className="border-t border-slate-200 dark:border-slate-700">
              <td className="p-2 font-bold text-xs">{i + 1}. {t.stage_names[i]}</td>
              {row.map((c, j) => <td key={j} className="p-1 text-center"><button disabled={showRef} onClick={() => cycle(i, j)} className={`w-10 h-8 rounded font-bold ${cellCls(c)}`}>{c}</button></td>)}
            </tr>))}</tbody>
        </table>
      </div>
      <div className="flex gap-2 mt-4 flex-wrap">
        <button onClick={check} disabled={showRef} className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.raci_check}</button>
        <button onClick={() => { setGrid(blank()); setResult(null); }} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg">{t.raci_reset}</button>
        <button onClick={() => setShowRef(!showRef)} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg">{showRef ? t.raci_hide : t.raci_show}</button>
      </div>
      {result && !showRef && (
        <div className="mt-3 text-sm">
          {result.errs.length ? result.errs.map((e, k) => <p key={k} className="text-red-600 dark:text-red-400">✗ {e}</p>) : <p className="text-green-700 dark:text-green-400">✓ {t.raci_ok}</p>}
          <p className="text-slate-500 mt-1">{t.raci_match.replace('{n}', result.n)}</p>
        </div>
      )}
    </LabCard>
  );
};

const DodLab = ({ t }) => {
  const [sel, setSel] = useState({});
  const items = t.dod_items;
  const risk = Math.max(0, 100 - items.reduce((s, it, i) => s + (sel[i] ? (it.ai ? 17 : 8) : 0), 0));
  const level = risk >= 60 ? 2 : risk >= 30 ? 1 : 0;
  const missing = items.filter((it, i) => it.ai && !sel[i]);
  const bar = ['bg-green-600', 'bg-amber-500', 'bg-red-600'][level];
  return (
    <LabCard title={t.mlab_labs[2].title} desc={t.mlab_labs[2].desc}>
      <p className="text-sm font-bold mb-2">{t.dod_title}</p>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
        {items.map((it, i) => (
          <label key={i} className="flex items-start gap-2 text-sm p-2 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer">
            <input type="checkbox" checked={!!sel[i]} onChange={() => setSel(s => ({ ...s, [i]: !s[i] }))} className="mt-1 accent-[#004030]" />
            <span>{it.label}{it.ai && <span className="ml-1 text-[10px] font-bold px-1.5 py-0.5 rounded bg-[#D8C3A5] text-[#004030]">AI</span>}</span>
          </label>
        ))}
      </div>
      <div className="mt-4">
        <div className="flex justify-between text-sm mb-1"><span>{t.dod_risk}</span><span className="font-bold">{t.dod_levels[level]} · {risk}</span></div>
        <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden"><div className={`h-3 ${bar} transition-all`} style={{ width: `${risk}%` }} /></div>
        <p className="text-sm mt-2">{missing.length ? <><strong>{t.dod_missing}</strong> {missing.map(m => m.label).join('、')}</> : <span className="text-green-700 dark:text-green-400">✓ {t.dod_none}</span>}</p>
      </div>
    </LabCard>
  );
};

const Slider = ({ label, v, set, min, maxV }) => (
  <label className="block text-sm"><span className="flex justify-between"><span>{label}</span><strong>{v}</strong></span>
    <input type="range" min={min} max={maxV} value={v} onChange={e => set(+e.target.value)} className="w-full accent-[#004030]" /></label>
);
const CapacityLab = ({ t }) => {
  const [out, setOut] = useState(160);
  const [rev, setRev] = useState(3);
  const [rate, setRate] = useState(4);
  const [days, setDays] = useState(10);
  const cap = rev * rate * days;
  const commit = Math.min(out, cap);
  const backlog = Math.max(0, out - cap);
  const util = Math.min(100, Math.round(out / cap * 100));
  const max = Math.max(out, cap, 1);
  return (
    <LabCard title={t.mlab_labs[3].title} desc={t.mlab_labs[3].desc}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <Slider label={t.cap_output} v={out} set={setOut} min={10} maxV={300} />
        <Slider label={t.cap_reviewers} v={rev} set={setRev} min={1} maxV={10} />
        <Slider label={t.cap_rate} v={rate} set={setRate} min={1} maxV={10} />
        <Slider label={t.cap_days} v={days} set={setDays} min={5} maxV={20} />
      </div>
      <div className="mt-4 space-y-2 text-sm">
        {[[t.cap_output, out, 'bg-[#D8C3A5]'], [t.cap_capacity, cap, 'bg-[#004030] dark:bg-emerald-500']].map(([l, v, c], i) => (
          <div key={i}><div className="flex justify-between"><span>{l}</span><strong>{v}</strong></div>
            <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden"><div className={`h-3 ${c}`} style={{ width: `${v / max * 100}%` }} /></div></div>
        ))}
      </div>
      <div className="grid grid-cols-3 gap-2 mt-4 text-center">
        {[[t.cap_commit, commit], [t.cap_backlog, backlog], [t.cap_util, util + '%']].map(([l, v], i) => (
          <div key={i} className="p-3 rounded-lg bg-slate-100 dark:bg-slate-900"><div className="text-xl font-black font-serif text-[#004030] dark:text-[#D8C3A5]">{v}</div><div className="text-xs text-slate-500">{l}</div></div>
        ))}
      </div>
      <p className={`text-sm mt-3 font-bold ${backlog > 0 ? 'text-red-600 dark:text-red-400' : 'text-green-700 dark:text-green-400'}`}>{backlog > 0 ? t.cap_bottleneck_review : t.cap_bottleneck_agent}</p>
      <p className="text-xs text-slate-500 mt-1">{t.cap_note}</p>
    </LabCard>
  );
};

/* ---------- App ---------- */
function App() {
  const LS_KEY = 'AGILE_SPA_analytics';
  const LS_STU = 'AGILE_SPA_student';
  const LS_VER = 'AGILE_SPA_version';
  const loadLS = (key, fb) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch { return fb; } };
  const emptyAnalytics = () => ({
    time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
    quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0), quizAnswered: Array(TOTAL).fill(0),
    cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0),
    visited: Array(TOTAL).fill(false), wrongTopics: {}
  });

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group: '', dept: '', id: '', nameEn: '', nameZh: '' }));
  const [analytics, setAnalytics] = useState(() => {
    const a = loadLS(LS_KEY, null);
    if (!a || !Array.isArray(a.time) || a.time.length !== TOTAL) return emptyAnalytics();
    return { ...emptyAnalytics(), ...a };
  });
  const menuRef = useRef(null);
  const t = dict[lang];

  const modulesList = Array.from({ length: TOTAL }, (_, i) => {
    const key = i === 0 ? 'm0' : i <= NUM_LEARN ? `m${i}` : i === IDX_LAB ? 'mlab' : i === IDX_RES ? 'mres' : null;
    const nav = key ? t[`${key}_nav`] : `${IDX_ANA}. ${t.analytics_title}`;
    const title = key ? (t[`${key}_title`] || nav) : t.analytics_title;
    return { id: i, num: i, icon: MODULE_ICONS[i], nav, title, short: nav.replace(/^\d+\.\s*/, '') };
  });

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en-GB'; }, [lang]);
  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(analytics)); } catch {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch {} }, [studentInfo]);
  useEffect(() => {
    try {
      const v = localStorage.getItem(LS_VER);
      if (v && v !== APP_VERSION && window.confirm(dict.zh.analytics_refresh_prompt + '\n' + dict.en.analytics_refresh_prompt)) {
        setAnalytics(emptyAnalytics());
      }
      localStorage.setItem(LS_VER, APP_VERSION);
    } catch {}
  }, []);
  useEffect(() => {
    setAnalytics(a => { if (a.visited[module]) return a; const v = [...a.visited]; v[module] = true; return { ...a, visited: v }; });
    const id = setInterval(() => {
      if (document.visibilityState !== 'visible') return;
      setAnalytics(a => { const tm = [...a.time]; tm[module] += 1; return { ...a, time: tm }; });
    }, 1000);
    return () => clearInterval(id);
  }, [module]);
  useEffect(() => {
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h); return () => document.removeEventListener('mousedown', h);
  }, []);
  useEffect(() => { if ('speechSynthesis' in window) { speechSynthesis.cancel(); setTtsState('idle'); } }, [module, lang]);

  const go = (i) => { setModule(i); setMenuOpen(false); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const countClick = () => setAnalytics(a => { const c = [...a.clicks]; c[module] += 1; return { ...a, clicks: c }; });

  const handleQuizSubmit = (mid, correct, total, wrongQs, moduleName, answered) => {
    setAnalytics(a => {
      const qc = [...a.quizCorrect], qt = [...a.quizTotal], qa = [...a.quizAnswered];
      qc[mid] = correct; qt[mid] = total; qa[mid] = answered;
      const wt = { ...a.wrongTopics }; wt[mid] = wrongQs || [];
      return { ...a, quizCorrect: qc, quizTotal: qt, quizAnswered: qa, wrongTopics: wt };
    });
  };
  const handleCardRead = (mid, readCount, shownCount, totalCount) => {
    setAnalytics(a => {
      const cr = [...a.cardsRead], ct = [...a.cardsTotal];
      cr[mid] = Math.max(cr[mid], readCount); ct[mid] = totalCount;
      return { ...a, cardsRead: cr, cardsTotal: ct };
    });
  };

  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { speechSynthesis.cancel(); setTtsState('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTtsState('paused'); return; }
    if (ttsState === 'paused') { speechSynthesis.resume(); setTtsState('playing'); return; }
    speechSynthesis.cancel();
    const sep = lang === 'zh' ? '。 ' : '. ';
    let texts = [];
    if (module === 0) {
      texts = [t.m0_title, t.m0_intro, t.m0_why, t.m0_why_desc, ...t.m0_stats.map(s => `${s.label}: ${s.val}`), ...t.m0_modules.map(m => `${m.title}. ${m.desc}`), t.m0_map_title, t.m0_map_desc];
    } else if (module >= 1 && module <= NUM_LEARN) {
      const mk = `m${module}`;
      texts = [t[`${mk}_title`], t.overview_label, t[`${mk}_overview`], ...(t[`${mk}_highlights`] || []),
        ...[1, 2, 3, 4, 5].map(n => t[`${mk}_p${n}`]).filter(Boolean), t.wrapup_label, t[`${mk}_wrapup`],
        ...(t[`${mk}_terms`] || []).flatMap(tm => [tm.front, tm.back])];
      if (AUTHOR_NOTE_MODULES.includes(module)) texts.splice(1, 0, t.author_note);
    } else if (module === IDX_LAB) {
      texts = [t.mlab_title, t.mlab_desc, ...t.mlab_labs.map(l => `${l.title}. ${l.desc}`)];
    } else if (module === IDX_RES) {
      texts = [t.mres_title, t.mres_desc, ...t.mres_groups.flatMap(g => [g.name, ...g.links.map(l => `${l.label}. ${l.desc}`)])];
    } else if (module === IDX_ANA) {
      const tc = analytics.quizCorrect.reduce((a, b) => a + b, 0);
      const ta = analytics.quizAnswered.reduce((a, b) => a + b, 0);
      const oa = ta > 0 ? Math.round(tc / ta * 100) : 0;
      const wk = [];
      for (let i = 1; i <= NUM_LEARN; i++) if (analytics.quizAnswered[i] > 0) { const a = Math.round(analytics.quizCorrect[i] / analytics.quizAnswered[i] * 100); if (a < 75) wk.push({ name: modulesList[i].short, acc: a }); }
      wk.sort((a, b) => a.acc - b.acc);
      texts = [t.analytics_title, t.analytics_desc,
        `${t.analytics_total_time}: ${analytics.time.reduce((a, b) => a + b, 0)}${t.analytics_sec}`,
        `${t.analytics_total_clicks}: ${analytics.clicks.reduce((a, b) => a + b, 0)}${t.analytics_times}`,
        `${t.analytics_overall_acc}: ${oa}%`];
      if (wk.length) { texts.push(t.analytics_wp_tts_intro); wk.forEach(w => texts.push(t.analytics_wp_tts_module.replace('{name}', w.name).replace('{acc}', w.acc))); }
      else if (ta > 0) texts.push(t.analytics_wp_tts_allpass);
    }
    texts = texts.filter(Boolean).map(s => String(s).replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ''));
    const utt = new SpeechSynthesisUtterance(texts.join(sep));
    utt.rate = 0.95;
    const voices = speechSynthesis.getVoices();
    if (lang === 'zh') {
      const v = voices.find(v => v.lang === 'zh-TW' && v.name.includes('Yating')) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.startsWith('zh'));
      if (v) utt.voice = v; utt.lang = 'zh-TW';
    } else {
      const v = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Male') || v.name.includes('Daniel'))) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en'));
      if (v) utt.voice = v; utt.lang = 'en-GB';
    }
    utt.onend = () => setTtsState('idle');
    utt.onerror = () => setTtsState('idle');
    speechSynthesis.speak(utt);
    setTtsState('playing');
  };

  /* ---- CSV ---- */
  const canExport = studentInfo.group && studentInfo.dept && studentInfo.id && studentInfo.nameEn && studentInfo.nameZh;
  const exportCSV = () => {
    if (!canExport) return;
    const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [
      ['Group', studentInfo.group], ['Dept', studentInfo.dept], ['Student ID', studentInfo.id], ['Name (EN)', studentInfo.nameEn], ['Name (ZH)', studentInfo.nameZh],
      ['Exported', new Date().toISOString()], [],
      ['Module', 'Time (sec)', 'Clicks', 'Cards Read', 'Cards Total', 'Quiz Correct', 'Quiz Answered', 'Quiz Total', 'Accuracy (%)', 'Wrong Questions']
    ];
    modulesList.forEach((m, i) => {
      const acc = analytics.quizAnswered[i] > 0 ? Math.round(analytics.quizCorrect[i] / analytics.quizAnswered[i] * 100) : '';
      rows.push([m.nav, analytics.time[i], analytics.clicks[i], analytics.cardsRead[i], analytics.cardsTotal[i], analytics.quizCorrect[i], analytics.quizAnswered[i], analytics.quizTotal[i], acc, (analytics.wrongTopics[i] || []).join(' | ')]);
    });
    const csv = '﻿' + rows.map(r => r.map(esc).join(',')).join('\r\n');
    const d = new Date(); const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    const fname = `${dict.zh.brand} ${dict.zh.title}_${studentInfo.nameEn} ${studentInfo.nameZh}_${ymd}.csv`;
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const clearAll = () => {
    if (!window.confirm(t.analytics_wp_clear_confirm)) return;
    try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_STU); } catch {}
    setAnalytics(emptyAnalytics());
    setStudentInfo({ group: '', dept: '', id: '', nameEn: '', nameZh: '' });
  };
  const sanitizeStudentId = (v) => v.replace(/[^0-9]/g, '').slice(0, 12);
  const sanitizeName = (v) => v.replace(/[<>"'&\\]/g, '').slice(0, 50);

  /* ---- Views ---- */
  const Overview = () => (
    <div className="space-y-8 animate-fade-in">
      <div className="rounded-2xl bg-[#004030] text-white p-6 sm:p-10 relative overflow-hidden">
        <p className="text-[#D8C3A5] font-bold tracking-widest text-sm mb-2">{t.brand} · {t.subtitle}</p>
        <h1 className="font-serif font-black text-2xl sm:text-4xl leading-tight mb-4">{t.m0_title}</h1>
        <p className="text-base sm:text-lg leading-relaxed text-slate-100">{t.m0_intro}</p>
        <button onClick={() => go(1)} className="mt-6 px-6 py-3 bg-[#D8C3A5] text-[#004030] font-bold rounded-lg inline-flex items-center gap-2">{t.m0_start}</button>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        {t.m0_stats.map((s, i) => (
          <div key={i} className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 text-center">
            <div className="text-4xl font-serif font-black text-[#004030] dark:text-[#D8C3A5]">{s.val}</div>
            <div className="text-sm text-slate-500 mt-1">{s.label}</div>
          </div>
        ))}
      </div>
      <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border-l-4 border-[#D8C3A5]">
        <h3 className="font-serif font-bold text-xl text-[#004030] dark:text-[#D8C3A5] mb-2 flex items-center gap-2"><IconAlertTriangle size={20} />{t.m0_why}</h3>
        <p className="leading-relaxed">{t.m0_why_desc}</p>
      </div>
      <div>
        <h3 className="font-serif font-bold text-xl text-[#004030] dark:text-[#D8C3A5] mb-1">{t.m0_map_title}</h3>
        <p className="text-sm text-slate-500 mb-3">{t.m0_map_desc}</p>
        <div className="ovmap rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 bg-white" onContextMenu={guard}
          dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(OVERVIEW_SVG, { USE_PROFILES: { svg: true, svgFilters: true } }) }} />
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {t.m0_modules.map((m, i) => (
          <button key={i} onClick={() => go(i + 1)} className="text-left bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 hover:border-[#004030] dark:hover:border-[#D8C3A5] transition-all">
            <div className="flex items-center gap-2 mb-1"><span className="text-xl">{MODULE_ICONS[i + 1]}</span><span className="font-serif font-black text-[#D8C3A5]">{m.num}</span></div>
            <div className="font-bold text-[#004030] dark:text-[#D8C3A5]">{m.title}</div>
            <p className="text-sm text-slate-500 mt-1">{m.desc}</p>
          </button>
        ))}
      </div>
    </div>
  );

  const LearnModule = () => {
    const mk = `m${module}`;
    return (
      <div className="space-y-6 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
        <H2 icon={modulesList[module].icon} number={module}>{t[`${mk}_title`]}</H2>
        {AUTHOR_NOTE_MODULES.includes(module) && <p className="text-sm px-4 py-2 rounded-lg bg-[#D8C3A5]/30 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-medium">⚑ {t.author_note}</p>}
        <div className="bg-[#004030]/5 dark:bg-[#D8C3A5]/5 rounded-xl p-5 border-l-4 border-[#D8C3A5]">
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2">{t.overview_label}</h3>
          <p>{t[`${mk}_overview`]}</p>
        </div>
        <div>
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">{t.highlights_label}</h3>
          <div className="flex flex-wrap gap-2">{t[`${mk}_highlights`].map((h, i) => <span key={i} className="px-3 py-1 bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] rounded-full text-sm font-medium">{h}</span>)}</div>
        </div>
        <div className="space-y-4">
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500">{t.deep_dive_label}</h3>
          <p>{t[`${mk}_p1`]}</p>
          <p className="p-4 bg-slate-100 dark:bg-slate-800 rounded-lg italic font-serif">{t[`${mk}_p2`]}</p>
          <p>{t[`${mk}_p3`]}</p>
          {t[`${mk}_p4`] && <p>{t[`${mk}_p4`]}</p>}
          {t[`${mk}_p5`] && <p>{t[`${mk}_p5`]}</p>}
        </div>
        <div>
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">{t.diagram_label}</h3>
          <div className="flex justify-center bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700"><ModuleDiagram m={module} lang={lang} isDark={isDark} t={t} /></div>
        </div>
        <FlipCardDeck key={`cards-${module}`} terms={t[`${mk}_terms`]} t={t} moduleId={module} onCardRead={handleCardRead} />
        <div className="bg-slate-100 dark:bg-slate-800 rounded-xl p-5">
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2">{t.wrapup_label}</h3>
          <p className="italic">{t[`${mk}_wrapup`]}</p>
        </div>
        <ModuleQuiz key={`quiz-${module}`} questions={t[`${mk}_q`]} t={t} moduleId={module} onQuizSubmit={handleQuizSubmit} moduleName={t[`${mk}_title`]} />
      </div>
    );
  };

  const LabView = () => (
    <div className="space-y-6 animate-fade-in">
      <H2 icon={modulesList[IDX_LAB].icon} number={IDX_LAB}>{t.mlab_title}</H2>
      <p className="text-lg text-slate-600 dark:text-slate-300">{t.mlab_desc}</p>
      <ProcessSimLab t={t} />
      <RaciLab t={t} />
      <DodLab t={t} />
      <CapacityLab t={t} />
    </div>
  );

  const ResView = () => (
    <div className="space-y-6 animate-fade-in">
      <H2 icon={modulesList[IDX_RES].icon} number={IDX_RES}>{t.mres_title}</H2>
      <p className="text-lg text-slate-600 dark:text-slate-300">{t.mres_desc}</p>
      {t.mres_groups.map((g, i) => (
        <div key={i}>
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{g.name}</h3>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">{g.links.map((l, j) => <LinkCard key={j} {...l} />)}</div>
        </div>
      ))}
    </div>
  );

  const AnalyticsView = () => {
    const tt = analytics.time.reduce((a, b) => a + b, 0);
    const tcl = analytics.clicks.reduce((a, b) => a + b, 0);
    const tc = analytics.quizCorrect.reduce((a, b) => a + b, 0);
    const ta = analytics.quizAnswered.reduce((a, b) => a + b, 0);
    const cr = analytics.cardsRead.reduce((a, b) => a + b, 0);
    const ctot = [1, 2, 3, 4, 5, 6].reduce((s, i) => s + t[`m${i}_terms`].length, 0);
    const visitedN = [...Array(NUM_LEARN)].filter((_, k) => analytics.visited[k + 1]).length;
    const quizN = [...Array(NUM_LEARN)].filter((_, k) => analytics.quizTotal[k + 1] > 0 && analytics.quizAnswered[k + 1] >= analytics.quizTotal[k + 1]).length;
    const weak = [];
    for (let i = 1; i <= NUM_LEARN; i++) if (analytics.quizAnswered[i] > 0) { const a = Math.round(analytics.quizCorrect[i] / analytics.quizAnswered[i] * 100); if (a < 75) weak.push({ i, a }); }
    weak.sort((x, y) => x.a - y.a);
    const field = (k, label, ph, san) => (
      <label className="block text-sm"><span className="font-medium">{label}</span>
        <input value={studentInfo[k]} placeholder={ph} onChange={e => setStudentInfo(s => ({ ...s, [k]: san(e.target.value) }))}
          className="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900" /></label>
    );
    return (
      <div className="space-y-6 animate-fade-in">
        <H2 icon={modulesList[IDX_ANA].icon} number={IDX_ANA}>{t.analytics_title}</H2>
        <p className="text-slate-600 dark:text-slate-300">{t.analytics_desc}</p>
        <p className="text-xs text-slate-500">{t.analytics_wp_saved}</p>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          {[[t.analytics_total_time, `${tt}${t.analytics_sec}`], [t.analytics_total_clicks, `${tcl}${t.analytics_times}`], [t.analytics_overall_acc, ta ? `${Math.round(tc / ta * 100)}%` : '—'], [t.analytics_card_usage, `${Math.round(cr / ctot * 100)}%`]].map(([l, v], i) => (
            <div key={i} className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 text-center">
              <div className="text-2xl sm:text-3xl font-serif font-black text-[#004030] dark:text-[#D8C3A5]">{v}</div><div className="text-xs text-slate-500 mt-1">{l}</div></div>
          ))}
        </div>
        <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.analytics_progress_title}</h3>
          <div className="text-sm mb-1">{t.analytics_progress_visited} {visitedN}/{NUM_LEARN} · {t.analytics_progress_quiz_done} {quizN}/{NUM_LEARN}</div>
          <div className="h-3 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden mb-4"><div className="h-3 bg-[#004030] dark:bg-[#D8C3A5]" style={{ width: `${(visitedN + quizN) / (NUM_LEARN * 2) * 100}%` }} /></div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
            {modulesList.slice(1, NUM_LEARN + 1).map(m => (
              <button key={m.id} onClick={() => go(m.id)} className="flex items-center justify-between text-left text-sm px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-[#004030] dark:hover:border-[#D8C3A5]">
                <span className="truncate">{m.icon} {m.nav}</span>
                <span className="text-xs shrink-0 ml-2">{analytics.quizTotal[m.id] > 0 && analytics.quizAnswered[m.id] >= analytics.quizTotal[m.id] ? '✅' : analytics.quizAnswered[m.id] > 0 ? `◐ ${analytics.quizAnswered[m.id]}/${analytics.quizTotal[m.id]}` : analytics.visited[m.id] ? '👁' : '○'}</span>
              </button>
            ))}
          </div>
          <p className="text-xs text-slate-500 mt-2">✅ {t.analytics_progress_quiz_done} · ◐ {t.analytics_progress_quiz_partial} · 👁 {t.analytics_progress_visited} · ○ {t.analytics_progress_not_visited}</p>
        </div>
        <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.analytics_wp_title}</h3>
          {ta === 0 ? <p className="text-sm text-slate-500">{t.analytics_no_data}</p> : weak.length === 0 ? <p className="text-sm text-green-700 dark:text-green-400">✓ {t.analytics_wp_allpass}</p> :
            weak.map(w => (
              <div key={w.i} className="mb-3 p-3 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
                <div className="flex justify-between flex-wrap gap-2"><strong className="text-sm">{modulesList[w.i].nav}</strong><span className="text-sm text-red-600 dark:text-red-400 font-bold">{w.a}%</span></div>
                <p className="text-xs mt-1 font-medium">{t.analytics_wp_incorrect}</p>
                <ul className="text-xs list-disc ml-5">{(analytics.wrongTopics[w.i] || []).map((q, k) => <li key={k}>{q}</li>)}</ul>
                <button onClick={() => go(w.i)} className="text-xs mt-2 font-bold text-[#004030] dark:text-[#D8C3A5] underline">{t.analytics_wp_goto}</button>
              </div>))}
        </div>
        <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 overflow-x-auto">
          <table className="w-full text-sm min-w-[560px]">
            <thead><tr className="text-left text-[#004030] dark:text-[#D8C3A5]"><th className="p-2">{t.analytics_module}</th><th className="p-2">{t.analytics_time}</th><th className="p-2">{t.analytics_clicks}</th><th className="p-2">{t.analytics_cards_read_total}</th><th className="p-2">{t.analytics_correct_ans_total}</th></tr></thead>
            <tbody>{modulesList.map((m, i) => (
              <tr key={i} className="border-t border-slate-200 dark:border-slate-700">
                <td className="p-2">{m.nav}</td><td className="p-2">{analytics.time[i]}{t.analytics_sec}</td><td className="p-2">{analytics.clicks[i]}</td>
                <td className="p-2">{i >= 1 && i <= NUM_LEARN ? `${analytics.cardsRead[i]} / ${t[`m${i}_terms`].length}` : '—'}</td>
                <td className="p-2">{i >= 1 && i <= NUM_LEARN ? (analytics.quizAnswered[i] > 0 ? `${analytics.quizCorrect[i]} / ${analytics.quizAnswered[i]} / ${t[`m${i}_q`].length}` : t.analytics_no_data) : '—'}</td>
              </tr>))}</tbody>
          </table>
        </div>
        <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.analytics_form_title}</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <label className="block text-sm"><span className="font-medium">{t.analytics_group}</span>
              <select value={studentInfo.group} onChange={e => setStudentInfo(s => ({ ...s, group: e.target.value }))} className="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900">
                <option value="">{t.analytics_group_select}</option>{t.group_options.map(g => <option key={g} value={g}>{g}</option>)}</select></label>
            {field('dept', t.analytics_dept, t.analytics_dept_ph, v => sanitizeName(v).slice(0, 20))}
            {field('id', t.analytics_id, t.analytics_id_ph, sanitizeStudentId)}
            {field('nameEn', t.analytics_name_en, t.analytics_name_en_ph, sanitizeName)}
            {field('nameZh', t.analytics_name_zh, t.analytics_name_zh_ph, sanitizeName)}
          </div>
          <div className="flex gap-3 mt-4 flex-wrap items-center">
            <button onClick={exportCSV} disabled={!canExport} className="px-5 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.analytics_export_csv}</button>
            <button onClick={clearAll} className="px-5 py-2 bg-red-600 text-white font-bold rounded-lg">{t.analytics_wp_clear}</button>
            {!canExport && <span className="text-xs text-slate-500">{t.analytics_fill_required}</span>}
          </div>
        </div>
      </div>
    );
  };

  const sideIcon = (i) => i === IDX_LAB ? <IconZapLab size={16} /> : i === IDX_RES ? <IconGlobe size={16} /> : i === IDX_ANA ? <IconActivity size={16} /> : <span aria-hidden="true">{MODULE_ICONS[i]}</span>;

  return (
    <div className="min-h-screen flex flex-col bg-[#f4f4f4] dark:bg-[#121212] text-slate-800 dark:text-slate-200 pt-16 overflow-x-hidden selection:bg-[#004030] selection:text-white dark:selection:bg-[#D8C3A5] dark:selection:text-[#004030]">
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="max-w-7xl mx-auto px-2 sm:px-4 h-16 flex items-center justify-between gap-2">
          <div className="flex items-center gap-1 sm:gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(!menuOpen)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_modules}>{menuOpen ? <IconX /> : <IconMenu />}</button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-72 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100] text-slate-800 dark:text-slate-200">
                  <p className="px-4 pt-3 pb-1 text-xs font-bold uppercase tracking-wider text-slate-400">{t.nav_modules}</p>
                  {modulesList.map(m => (
                    <button key={m.id} onClick={() => go(m.id)} className={`w-full flex items-center gap-3 px-4 py-3 text-sm text-left hover:bg-slate-100 dark:hover:bg-slate-700 ${module === m.id ? 'font-bold text-[#004030] dark:text-[#D8C3A5]' : ''}`}>
                      <span className="w-5 flex justify-center">{sideIcon(m.id)}</span><span className="truncate">{m.nav}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={() => go(0)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_home}><IconHome size={18} /></button>
            <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest">{t.brand}</span>
              <span className="hidden lg:inline font-serif font-bold text-sm md:text-base truncate">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2 shrink-0">
            <button onClick={() => handleTTS(ttsState === 'playing' ? 'pause' : 'play')} className="p-2 hover:bg-white/10 rounded-lg flex items-center gap-1" aria-label={t.audio_read} title={t.audio_read}>
              {ttsState === 'playing' ? <IconPause size={18} /> : <IconPlay size={18} />}<span className="hidden md:inline text-xs">{ttsState === 'playing' ? t.audio_pause : t.audio_read}</span></button>
            {ttsState !== 'idle' && <button onClick={() => handleTTS('stop')} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.audio_stop}><IconSquare size={16} /></button>}
            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="px-2 sm:px-3 py-1.5 border border-[#D8C3A5]/60 rounded-lg text-xs sm:text-sm font-bold text-[#D8C3A5] hover:bg-white/10">{t.lang_toggle}</button>
            <button onClick={() => setIsDark(!isDark)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.theme_toggle}>{isDark ? <IconSun size={18} /> : <IconMoon size={18} />}</button>
          </div>
        </div>
      </header>

      <div className="flex-1 w-full max-w-7xl mx-auto flex">
        <aside className="hidden md:block w-64 shrink-0 border-r border-slate-200 dark:border-slate-800 py-6 pr-2">
          <div className="sticky top-20">
            <p className="px-4 pb-2 text-xs font-bold uppercase tracking-wider text-slate-400">{t.nav_modules}</p>
            {modulesList.map(m => (
              <button key={m.id} onClick={() => go(m.id)} className={`w-full flex items-center gap-3 px-4 py-2.5 text-sm text-left rounded-r-lg border-l-4 transition-all ${module === m.id ? 'border-[#D8C3A5] bg-[#004030]/10 dark:bg-[#D8C3A5]/10 font-bold text-[#004030] dark:text-[#D8C3A5]' : 'border-transparent hover:bg-slate-200/60 dark:hover:bg-slate-800'}`}>
                <span className="w-5 flex justify-center shrink-0">{sideIcon(m.id)}</span><span className="truncate">{m.nav}</span>
              </button>
            ))}
          </div>
        </aside>
        <main key={`main-${module}`} className="flex-1 min-w-0 px-4 sm:px-8 py-8" onClick={countClick}>
          {module === 0 && Overview()}
          {module >= 1 && module <= NUM_LEARN && LearnModule()}
          {module === IDX_LAB && LabView()}
          {module === IDX_RES && ResView()}
          {module === IDX_ANA && AnalyticsView()}
          <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700">
            <button onClick={() => go(Math.max(0, module - 1))} disabled={module === 0} className="px-5 py-2 rounded-lg border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold disabled:opacity-0">← {t.nav_prev}</button>
            <button onClick={() => go(Math.min(TOTAL - 1, module + 1))} disabled={module === TOTAL - 1} className="px-5 py-2 rounded-lg bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold disabled:opacity-0 inline-flex items-center gap-1">{t.nav_next} <IconChevronRight size={16} /></button>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0 gap-2">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span>{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">{t.architect_name}</a></span>
          <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

if (!window.__AGILE_BLOCKED__) ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
