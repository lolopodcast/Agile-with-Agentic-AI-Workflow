  m2_nav: "2. 端到端流程",
  m2_title: "端到端流程：六階段循環",
  m2_overview: "價值依序流經六個階段：探索、規劃、建置、驗證、發布與學習、改善。每一階段都以「輸入 → 活動 → 產出 → 關卡」界定，使 Scrum 事件與產出物落在同一個連續循環中，而非分散的清單。",
  m2_highlights: ["輸入 → 活動 → 產出 → 關卡", "六階段循環", "審查產能", "退回建置", "驗證式學習"],
  m2_p1: "第 1 階段「探索」的輸入是客戶需求、市場訊號，以及上一循環的遙測資料。代理人分析市場、把模糊回饋轉為規格，並與客戶端代理人協商；人類則與真實客戶驗證價值假設。產出是已排序的產品待辦清單，關卡是由 PM 掌握的產品目標。",
  m2_p2: "第 2 階段「規劃」對應 Sprint 規劃。代理人提出工作拆解與排序，人類決定範圍。由於瓶頸已從寫程式的產能轉為審查產能，故事點速度必須重新校準。關卡是 Scrum 團隊共同確認的 Sprint 目標。",
  m2_p3: "第 3 階段「建置」在 Sprint 中進行。代理人在 PjM 設定的護欄內產碼、測試與修復，並以非同步方式發布進度摘要。15 分鐘的每日 Scrum 仍然保留，但用來檢視 Sprint 目標的進度並排除障礙，而不是收集狀態報告。第 4 階段「驗證」結合自動掃描與人類的架構及資安審查，只有符合完成的定義的增量才能通過，其餘一律退回建置。",
  m2_p4: "第 5 階段「發布與學習」結合 Sprint 審查與 MVP 循環：發布增量、全天候監測遙測資料，PM 與利害關係人共同檢視結果，決定假設成立、轉向或放棄。第 6 階段「改善」即 Sprint 回顧，重新校準護欄、DoD 與心理安全感，其產出再進入下一次探索，形成完整循環。",
  m2_p5: "把循環視為流程，也能看出時間真正花在哪裡。在代理式團隊中，工作很少卡在建置，而是卡在驗證前的佇列，以及發布與學習階段等待利害關係人決策。因此，管理者應衡量整個循環的流動，包括審查等待時間，以及從驗證退回建置的比率，而不是只為產碼速度變快而慶祝。退回率上升是早期警訊，代表護欄、規格或 DoD 需要調整。",
  m2_wrapup: "六階段循環把零散的 Scrum 事件與產出物，整合成一個具有明確輸入、活動、產出與關卡的流程。它與傳統 Scrum 循環有兩點不同：第一，規劃以人類審查產能為基礎，因為代理人已讓寫程式不再是限制條件；第二，驗證是明確的獨立階段，並設有退回路徑，確保建置的速度不會繞過品質。第 5、6 階段的遙測資料與改善事項回饋到下一次探索，使學習得以累積，而非一次性。",
  m2_terms: [
    { front: "關卡", back: "階段結束時的決策點，決定工作繼續、重做或停止。" },
    { front: "審查產能", back: "人類在一段期間內能實質審查並核准的代理人產出量，是新的瓶頸。" },
    { front: "候選增量", back: "第 3 階段代理人產出、尚未通過完成的定義的成果。" },
    { front: "已完成增量", back: "符合完成的定義、可以發布的增量。" },
    { front: "進度摘要", back: "由代理人以非同步方式產生的工作狀態摘要，取代口頭狀態報告。" },
    { front: "驗證式學習", back: "透過真實使用者測試假設所獲得的客戶證據（建置–衡量–學習）。" }
  ],
  m2_q: [
    { q: "某團隊的代理人每個 Sprint 產出三倍程式碼，但待審查項目大量堆積，Sprint 目標屢屢落空。最可能的原因是？", opts: ["代理人故意寫出低品質程式碼", "規劃忽略了已成為瓶頸的審查產能", "Sprint 長度太長", "產品目標不清楚"], ans: _A1, exp: "代理人讓寫程式不再是限制條件後，人類審查就成為瓶頸，規劃必須以審查產能為基礎。" },
    { q: "關於第 3 階段的每日 Scrum，下列何者正確？", opts: ["因代理人會發布摘要而廢除", "變成代理人的狀態報告會議", "仍是 15 分鐘的事件，用來檢視 Sprint 目標進度並排除障礙", "由 Sprint 審查取代"], ans: _A2, exp: "摘要負責呈現進度；每日 Scrum 維持檢視 Sprint 目標進度的目的。" },
    { q: "某候選增量通過自動測試，但未通過人類資安審查。接下來會如何？", opts: ["退回第 3 階段建置", "附上警示標籤後發布", "跳到第 6 階段改善", "因自動測試已通過而接受"], ans: _A0, exp: "只有符合 DoD 的增量能通過驗證，其餘一律退回建置。" },
    { q: "第 5 階段的遙測資料顯示使用者忽略新功能。依 MVP 邏輯，關卡應如何決策？", opts: ["成立，因為功能已如期交付", "把增量退回驗證", "延長 Sprint", "轉向或放棄假設，並更新產品待辦清單"], ans: _A3, exp: "發布與學習是在測試假設；證據不支持時，應轉向或放棄。" },
    { q: "什麼讓六階段循環得以完整銜接？", opts: ["Sprint 審查核准預算", "PjM 簽核已完成增量", "第 5、6 階段的產出（遙測、改善事項）進入第 1 階段探索", "代理人自動開啟新的 Sprint"], ans: _A2, exp: "遙測資料與回顧改善事項成為下一次探索的輸入。" },
    { q: "為什麼每個階段都以「輸入 → 活動 → 產出 → 關卡」界定？", opts: ["讓交接、職責與控制點明確且可追溯", "讓 Scrum 事件時間更長", "取代 Scrum Guide", "減少階段數量"], ans: _A0, exp: "這種界定方式讓流程可追溯：輸入什麼、做什麼、產出什麼、由誰決定。" }
  ],

  m3_nav: "3. 當責矩陣",
  m3_title: "當責：對外 PM、對內 PjM 與 RACI",
  m3_overview: "當代理人執行大部分工作時，最關鍵的管理問題變成：誰為結果負責？本模組把 Scrum 的當責對應到對外 PM、對內 PjM 與系統架構師，並以 RACI 矩陣讓每個階段都只有一位人類當責者。",
  m3_highlights: ["RACI", "每階段一位人類 A", "PM：對外價值", "PjM：對內流程", "有權責才能服務"],
  m3_p1: "RACI 矩陣區分四種關係：R 執行（實際做事）、A 當責（為結果負責）、C 諮詢、I 告知。本架構訂有兩條規則：每個階段只有一位人類 A；代理人可以是 R，但永遠不能是 A。當責無法委託給一個無法被究責的系統。",
  m3_p2: "產品負責人重新定位為對外的產品經理（PM）。PM 掌握市場價值、商業策略與產品目標，並為探索、規劃、發布與學習三個階段當責。代理人可以分析市場、草擬待辦項目，但價值當責不可委託。",
  m3_p3: "Scrum Master 重新定位為對內的流程專案經理（PjM）。這刻意偏離了 Scrum Guide 2020，因為該指南並未設置專案經理角色。作者的立場是：沒有權責的 Scrum Master 無法真正發揮服務功能；在代理式工作流中，必須有人對代理人護欄、內部工作流與跨部門瓶頸擁有明確權責。PjM 為建置與改善兩個階段當責，並持續營造心理安全感。",
  m3_p4: "開發人員轉型為系統架構師，負責架構、資安與完成的定義的合規，並為驗證階段當責。他們的工作從手寫程式轉為設計架構與審查代理人產出，也因此帶來長期隱憂：初階開發者失去了傳統上培養架構判斷力的實作路徑。",
  m3_p5: "明確的當責也會改變事件處理方式。當代理人造成缺陷時，要問的不是哪個代理人犯錯，而是哪一位當責的人類掌握了該階段與其控制措施，這可以避免責任在系統中被稀釋。它也保護心理安全感：由於 RACI 矩陣已明訂由誰決策、由誰修正，成員可以公開回報代理人的失誤，而不必在事後爭論責任歸屬。從這個意義來說，當責是在工作開始前就做好的設計選擇。",
  m3_wrapup: "代理式 AI 敏捷是重新分配當責，而不是取消當責。PM 對外，為價值負責；PjM 對內，為工作流與護欄負責；系統架構師則為增量是否真正完成負責。RACI 矩陣落實了「每個階段都有一位可被究責的人類」這項原則，而代理人承擔大部分的執行責任。把 SM 重新定位為 PjM 是有意識地偏離 Scrum Guide，理由是：當機器執行多數工作時，沒有權責的服務難以發揮作用。",
  m3_terms: [
    { front: "RACI", back: "責任分配矩陣：執行（R）、當責（A）、諮詢（C）、告知（I）。" },
    { front: "當責（A）", back: "為某一階段結果負責的唯一人選；在本架構中一定是人類。" },
    { front: "執行（R）", back: "實際執行工作者；代理人可以擔任此角色。" },
    { front: "產品經理（PM，對外）", back: "重新定位的產品負責人，掌握市場價值、策略與產品目標。" },
    { front: "流程專案經理（PjM，對內）", back: "重新定位的 Scrum Master，對內部工作流與代理人護欄擁有明確權責（作者立場）。" },
    { front: "系統架構師", back: "重新定位的開發人員，負責架構、資安與 DoD 合規，以審查取代手寫程式。" }
  ],
  m3_q: [
    { q: "下列哪一種 RACI 指派違反本架構的規則？", opts: ["第 3 階段：PjM = A，代理人 = R", "第 4 階段：架構師 = A/R，代理人 = R", "第 1 階段：代理人 = A，PM = R", "第 6 階段：PjM = A，PM = C"], ans: _A2, exp: "代理人可以是 R，但永遠不能是 A；每個階段需要一位人類 A。" },
    { q: "本架構為什麼把 Scrum Master 重新定位為 PjM？", opts: ["因為 Scrum Guide 2020 要求設置專案經理", "因為在代理式系統中，對護欄與工作流沒有明確權責的服務難以發揮作用", "為了減輕 PM 的工作量", "讓代理人只向一個人回報"], ans: _A1, exp: "作者立場：在機器執行多數工作的系統中，沒有權責的角色無法真正服務。" },
    { q: "市場分析代理人建議刪除某關鍵客群重視的功能。誰為最終決策當責？", opts: ["市場分析代理人", "PjM", "客戶端代理人", "PM"], ans: _A3, exp: "價值決策屬於 PM，PM 為探索階段與產品目標當責。" },
    { q: "建置階段的代理人一再超出 API 成本上限，兩個部門為了誰該核准更高預算而爭執。誰應擔任當責者？", opts: ["PjM", "PM", "系統架構師", "代理人供應商"], ans: _A0, exp: "PjM 為建置階段當責，並對護欄與跨部門瓶頸擁有權責。" },
    { q: "開發人員轉型為系統架構師，伴隨哪一項長期風險？", opts: ["手寫程式過多", "失去產品目標", "初階人才培育斷層", "每日 Scrum 時間變長"], ans: _A2, exp: "初階程式工作被自動化後，初階人員失去培養架構判斷力的路徑。" },
    { q: "有人批評 PjM 的重新定位違背 Scrum Guide。下列哪一種回應最站得住腳？", opts: ["Scrum Guide 已經廢止", "這是明確且有理由的偏離：已標示為作者立場，並以治理代理人所需的權責作為依據", "PjM 與傳統專案經理完全相同", "Scrum Master 角色已完全不存在"], ans: _A1, exp: "站得住腳的偏離，會清楚說明改了什麼、為什麼改。" }
  ],

  m4_nav: "4. 控制關卡",
  m4_title: "控制關卡：產出物與承諾",
  m4_overview: "每項 Scrum 產出物都對應一項承諾；在本架構中，每項承諾都扮演一道控制關卡：產品目標控制方向、Sprint 目標控制聚焦、完成的定義控制品質。",
  m4_highlights: ["G1 方向：產品目標", "G2 聚焦：Sprint 目標", "G3 品質：完成的定義", "AI 專屬檢核", "程式碼來源追溯"],
  m4_p1: "Scrum Guide 2020 讓每項產出物搭配一項承諾：產品待辦清單搭配產品目標、Sprint 待辦清單搭配 Sprint 目標、增量搭配完成的定義。承諾讓產出物透明，也讓團隊有檢視的基準。在代理式工作流中，承諾更成為人類判斷約束機器活動的關鍵點。",
  m4_p2: "G1「方向」位於探索階段結束時。代理人可以持續產生並重新排序待辦項目，但若缺少產品目標，它們會傾向追求最容易衡量的訊號。由 PM 掌握的產品目標，是所有代理人排序的錨點。",
  m4_p3: "G2「聚焦」橫跨規劃與建置。代理人擅長拆解工作，卻容易只追求局部任務的最佳化。Sprint 目標讓 Sprint 有單一而一致的目標，也是每次每日 Scrum 的檢驗基準：目標是否仍可達成？若不可達成，需要與 PM 重新協商哪些範圍？",
  m4_p4: "G3「品質」是最關鍵的關卡。由於代理人能大量產出看似合理卻有缺陷的成果，完成的定義必須明列 AI 專屬檢核：資安掃描、測試覆蓋率門檻、生成程式碼與相依套件的來源追溯，以及人類審查簽核。薄弱的 DoD 會把更高的產出量直接轉化為更高的不穩定。",
  m4_p5: "關卡也需要負責者與證據。G1 由 PM 掌握，證據是代理人可以引用的書面產品目標；G2 由 Scrum 團隊共同確認，並每日檢驗；G3 由系統架構師掌握，證據包括掃描報告、測試結果、來源追溯紀錄，以及具名簽核。沒有負責者的關卡會流於形式，沒有證據的關卡則只是意見。在產出量龐大的代理式工作流中，兩者缺一不可，關卡才會只在應該攔阻時攔阻工作。",
  m4_wrapup: "控制關卡把 Scrum 的承諾轉化為可落實的檢查點。G1 讓代理人的排序始終對準策略目標；G2 讓 Sprint 在代理人傾向局部最佳化的情況下仍保持一致；G3 判定產出是否真正完成。三者之中，完成的定義在代理式系統中最為關鍵，因為它是人類判斷能阻止「快速但有缺陷的產出」到達使用者手上的最後一道防線。因此，以 AI 專屬檢核強化 DoD，是團隊最有效的品質投資。",
  m4_terms: [
    { front: "承諾", back: "與每項 Scrum 產出物搭配的元素，提供檢視基準並提升透明度。" },
    { front: "產品目標", back: "產品的長期目標；產品待辦清單的承諾，也是關卡 G1。" },
    { front: "Sprint 目標", back: "一個 Sprint 的單一目標；Sprint 待辦清單的承諾，也是關卡 G2。" },
    { front: "完成的定義（DoD）", back: "增量必須符合的正式品質標準；增量的承諾，也是關卡 G3。" },
    { front: "程式碼來源追溯", back: "追溯生成程式碼與相依套件的出處，包括授權與來源。" },
    { front: "人類簽核", back: "由當責的人類在增量被視為完成前明確核准。" }
  ],
  m4_q: [
    { q: "下列哪一組產出物與承諾的搭配正確？", opts: ["Sprint 待辦清單 – 產品目標", "增量 – 完成的定義", "產品待辦清單 – Sprint 目標", "增量 – Sprint 目標"], ans: _A1, exp: "產品待辦清單–產品目標、Sprint 待辦清單–Sprint 目標、增量–完成的定義。" },
    { q: "待辦清單代理人不斷把點擊率最高、而非策略價值最高的項目排在前面。缺少或薄弱的是哪一道關卡？", opts: ["G1 產品目標", "G2 Sprint 目標", "G3 完成的定義", "沒有問題，這是代理人的正常行為"], ans: _A0, exp: "缺少產品目標時，代理人會追求最容易衡量的訊號。" },
    { q: "下列何者「不是」本架構提出的 AI 專屬 DoD 檢核？", opts: ["資安掃描", "程式碼來源追溯", "人類審查簽核", "使用的代理人數量"], ans: _A3, exp: "DoD 檢核的是品質與可追溯性，而不是使用了多少代理人。" },
    { q: "Sprint 進行到一半，代理人回報外部 API 變更使 Sprint 目標無法達成。應該如何處理？", opts: ["代理人自行重新定義 Sprint 目標", "Sprint 自動延長", "開發人員與 PM 重新協商範圍，同時維持 Sprint 的一致性", "放寬 DoD"], ans: _A2, exp: "每日 Scrum 都會檢驗 Sprint 目標；無法達成時，應與 PM 重新協商範圍。" },

  m5_nav: "5. 四構面",
  m5_title: "四構面與對應總表",
  m5_overview: "作者提出的四構面（客戶、開發、MVP、組織）說明代理式 AI 在哪些地方改變了敏捷。本模組把每個構面對應到一項敏捷宣言價值、一個流程階段與具體的 Scrum 元素，並與 Scrum 三大經驗主義支柱區分。",
  m5_highlights: ["客戶互動協作", "漸進迭代", "MVP 回饋循環", "跨域融合", "可追溯性"],
  m5_p1: "四構面是一套分析架構，並非 Scrum 三大經驗主義支柱（透明、檢視、調適）的改寫。它的價值在於可追溯性：每個構面都把一項宣言價值連結到循環中的一個階段與具體的 Scrum 元素，讓某一處的改變可以在整個系統中被追蹤。",
  m5_p2: "「客戶：互動協作」對應「客戶協作重於合約協商」與第 1 階段。代理人擔任虛擬分析師，並越來越常與客戶端代理人直接協商。「開發：漸進迭代」對應「可用的軟體重於詳盡的文件」與第 2–4 階段；週期時間大幅縮短，但效益受審查產能與交付穩定度限制。",
  m5_p3: "「MVP：回饋循環」對應「回應變化重於遵循計畫」與第 5 階段。代理人能快速組裝原型並全天候監測遙測資料，但 MVP 的本質仍是驗證式學習的工具，而非展示品。沒有可衡量假設、也沒有真實使用者的原型，不能稱為 MVP。",
  m5_p4: "「組織：跨域融合」對應「個人與互動重於流程與工具」與第 6 階段，同時貫穿整個循環。多代理人系統可以跨領域轉譯並對齊知識庫，但源自誘因與權責的穀倉效應仍須人類治理；單靠資訊流通無法消除穀倉。",
  m5_p5: "可追溯性在情況改變時最有用。假設客戶導入自己的協商代理人，客戶構面顯示受影響的是第 1 階段；對應總表接著指出需要調整的 Scrum 元素是產品待辦清單與待辦清單精煉，保障措施則是人類價值驗證。反向推理也成立：驗證階段退回率上升，可追溯到開發構面與 DoD。四構面因此能把策略層面的觀察，轉化為具體的流程決策。",
  m5_wrapup: "四構面說明代理式 AI 在「哪裡」改變了敏捷，對應總表則說明這些改變「如何」彼此串接。客戶協作部分轉為代理人對代理人；開發在審查產能的限制內加速；MVP 循環持續運作，但仍取決於驗證式學習；跨域融合受益於代理人，但本質上仍是誘因與治理的問題。把四構面與 Scrum 經驗主義支柱清楚區分，可以避免概念混淆，也讓本架構自身的貢獻更加明確。",

    { q: "開發構面主要對應哪些階段？", opts: ["第 1 階段", "第 2–4 階段", "第 5 階段", "第 6 階段"], ans: _A1, exp: "開發構面涵蓋規劃、建置與驗證。" },
    { q: "客戶端代理人與您的代理人協商需求。適用哪一個構面與保障措施？", opts: ["組織；由代理人決定範圍", "MVP；以遙測取代協商", "客戶；由人類保留價值驗證", "開發；由 DoD 管理協商"], ans: _A2, exp: "代理人對代理人協商屬於客戶構面，並由人類驗證價值。" }

  m6_nav: "6. 分階段風險",
  m6_title: "分階段風險：風險與控制措施對應",
  m6_overview: "當代理人接手執行，循環中的每個階段都會出現特有的風險。本模組把六項風險對應到各自的階段，並為每項風險搭配一項控制措施，讓風險管理成為流程的一部分，而不是事後補救。",
  m6_highlights: ["合成回饋", "速度指標失真", "逾越護欄", "產出量與穩定度", "人才培育"],
  m6_p1: "在探索階段，風險是以模擬使用者產生的合成回饋取代真實客戶，控制措施是由人類驗證價值假設。在規劃階段，故事點是依人類投入校準的，代理人產碼後故事點速度便失去意義，控制措施是改以審查產能規劃。",
  m6_p2: "在建置階段，代理人可能逾越護欄，接觸權限範圍外的系統、資料或預算。控制措施是由 PjM 掌握護欄，並搭配稽核紀錄，讓代理人的每項行動都可追溯。",
  m6_p3: "在驗證階段，產出量提高可能伴隨穩定度下降與資安漏洞。業界對 AI 輔助開發的研究也呈現此模式：產出增加，但若審查與平台能力跟不上，不穩定度也會上升。控制措施是含 AI 專屬檢核的 DoD。在發布與學習階段，原型可能被誤認為 MVP，控制措施是要求可衡量的假設。",
  m6_p4: "在改善階段，風險較慢浮現也較不明顯：初階工作被自動化後，初階人才的培育管道逐漸流失。控制措施是在審查中刻意安排學習角色，例如讓初階開發者與架構師一同審查代理人產出，讓判斷力得以持續養成。",
  m6_p5: "把這些風險當成風險登錄表而非檢查清單，十分重要。各階段的嚴重度不同，也會隨時間改變：驗證階段的不穩定往往急迫且明顯，改善階段的人才流失則緩慢發生，容易被忽略，直到資深人才短缺時才浮現。因此，管理者應在每次 Sprint 回顧中檢視風險登錄表，把每項風險交給該階段的當責者，並追蹤領先指標，例如審查等待時間、退回率、護欄事件，以及初階人員參與審查的比例。代理式工作流中的風險管理是持續性的，而非一次性的評估。",
  m6_wrapup: "把風險對應到階段，讓風險管理成為循環的設計特色。每項風險都出現在代理人改變工作本質之處：探索的模擬客戶、規劃的指標失真、建置的越權、驗證的不穩定、發布與學習的假 MVP，以及改善階段的人才斷層。每項控制措施都依循模組 1 建立的原則：代理人執行，人類判斷並保有當責。能說出每個階段風險與控制措施的管理者，才是在治理代理式工作流，而不只是部署它。",
  m6_terms: [
    { front: "合成回饋", back: "由模擬使用者或虛擬人物而非真實客戶產生的回饋。" },
    { front: "速度指標失真", back: "當故事點所依據的投入不再是限制條件時，速度指標失去意義。" },
    { front: "護欄", back: "限制代理人可存取、修改或花費範圍的規則或上限。" },
    { front: "稽核紀錄", back: "代理人每項行動的可追溯紀錄，用於究責與事件分析。" },
    { front: "交付穩定度", back: "變更進入正式環境時不發生故障或回滾的可靠程度。" },
    { front: "人才培育管道", back: "初階人員成長為資深專家的路徑。" }
  ],
  m6_q: [
    { q: "哪一項控制措施對應建置階段「代理人逾越權限」的風險？", opts: ["由人類驗證假設", "由 PjM 掌握護欄並搭配稽核紀錄", "以審查產能規劃", "可衡量的假設"], ans: _A1, exp: "護欄防止越權；稽核紀錄讓代理人行動可追溯。" },
    { q: "某產品團隊倚賴模擬使用者核准新功能。這屬於哪一個階段風險？", opts: ["探索：合成回饋取代真實客戶", "規劃：速度指標失真", "驗證：程式碼資安漏洞", "改善：人才流失"], ans: _A0, exp: "模擬使用者無法取代真實客戶的驗證。" },
    { q: "業界對 AI 輔助開發的研究，最一致地呈現哪一種模式？", opts: ["產出量下降、穩定度上升", "沒有可衡量的影響", "部署次數減少", "產出量上升，但若審查與平台能力跟不上，不穩定度也上升"], ans: _A3, exp: "產出增加若沒有審查與平台能力配合，會伴隨不穩定。" },
    { q: "下列何者最能因應人才培育斷層？", opts: ["只聘用資深架構師", "禁止代理人處理簡單任務", "在審查中安排學習角色，例如讓初階人員與架構師搭配", "延長 Sprint"], ans: _A2, exp: "刻意設計的學習角色，能讓判斷力持續養成。" },
    { q: "為什麼代理人產碼後，速度指標會失真？", opts: ["故事點是依人類撰寫程式的投入校準，已無法反映真正的限制條件", "代理人拒絕估算", "Scrum Guide 要求使用速度指標", "Sprint 變長"], ans: _A0, exp: "限制條件已轉為審查產能，以投入為基礎的故事點因此失去意義。" },
    { q: "六項控制措施背後的共同原則是什麼？", opts: ["代理人應為其產出當責", "代理人執行，人類判斷並保有當責", "風險管理只屬於 Sprint 回顧", "風險應由客戶承擔"], ans: _A1, exp: "每項控制措施都讓人類判斷與當責留在循環中。" }
  ],

  m0_nav: "0. Executive Summary",
  m0_title: "Executive Summary: Agile Management in the Agentic AI Era",
  m0_intro: "By late 2026, AI agents no longer merely assist developers. They plan, write, test and repair code, negotiate specifications, and monitor products around the clock. This shift does not make Agile obsolete; it changes where the bottleneck sits, who holds accountability, and which controls matter most. This learning module reorganises Agile management around five questions asked in sequence: what the system is made of, how value flows through it, who does what and who answers for it, where quality and direction are enforced, and what can go wrong at each stage. The answers form a four-layer architecture (Strategy, Orchestration, Execution, Assurance), a six-stage end-to-end loop (Discover, Plan, Build, Verify, Release & Learn, Improve), a RACI matrix in which every stage has exactly one human accountable owner, and three control gates anchored in Scrum's commitments: the Product Goal, the Sprint Goal and the Definition of Done. Parts of this framework deliberately depart from the Scrum Guide 2020. Most notably, the Scrum Master is reframed as an internal Process Project Manager with explicit authority over the workflow and agent guardrails, because a role without authority cannot effectively serve a system in which machines execute most of the work. Throughout, you will be asked to judge rather than memorise: when should a gate fail an Increment, when does velocity mislead, and how should a manager respond when a client's own agents become the counterpart in requirement negotiation?",
  m0_why: "Why Does This Matter for Managers?",
  m0_why_desc: "Agentic AI moves the constraint from producing work to judging it. Managers who keep planning by coding capacity will over-commit, under-verify and blur accountability. Organisations that redesign roles, gates and metrics around human judgement capture the speed without inheriting the instability.",

  m1_nav: "1. System Architecture",
  m1_title: "System Architecture: From Human Teams to Four Layers",
  m1_overview: "Agentic AI Agile replaces the human team as the execution engine with AI agents, while humans move to directing, orchestrating and assuring. This module defines the paradigm shift and the four-layer architecture that structures the rest of the framework.",
  m1_highlights: ["Paradigm Shift", "Asynchronous Coordination", "Four-Layer Architecture", "Human–Agent Interaction", "Lean Software Development"],
  m1_p1: "Traditional Agile is a human-driven and largely synchronous system. Time-boxed Sprints, face-to-face interaction and manual alignment allow a small team to deliver value iteratively. Its constraint is human capacity: how much a team can design, code and test within a Sprint. Coordination happens in meetings, and alignment depends on people talking to people.",
  m1_p2: "In Agentic AI Agile, the execution engine changes. AI agents generate, test and repair code; coordination becomes asynchronous and event-driven; and interaction expands from human–human to human–agent and agent–agent, including a vendor's agents negotiating directly with a client's trained agents.",
  m1_p3: "The four-layer architecture makes this shift explicit. L1 Strategy, owned by the external-facing PM, defines value: the Why and the What. L2 Orchestration, owned by the internal PjM, designs and governs the workflow and agent guardrails. L3 Execution is where agents produce the Increment. L4 Assurance, owned by System Architects, verifies output against the Definition of Done and owns architecture and security.",
  m1_p4: "The design rule is simple but strict: agents operate in L3 and assist the other layers, yet accountability exists only in the human layers. This extends Lean Software Development: automation eliminates waste, while humans amplify learning by judging what the agents produce.",
  m1_p5: "For managers, the architecture is also a diagnostic tool. When something goes wrong, the first question is which layer failed. A misdirected backlog is an L1 problem; agents acting beyond their scope point to L2; defective code that reaches users signals a weakness in L4. Problems are rarely solved by adding more agents to L3, because execution capacity is seldom the true constraint. Locating a failure in the correct layer prevents the common mistake of treating governance problems as productivity problems, and it clarifies which human owner must act.",
  m1_wrapup: "Agentic AI Agile is not a faster version of the same system; it is a different system. The execution engine moves from people to agents, coordination becomes asynchronous, and interaction now includes agents on both sides of a business relationship. The four-layer architecture keeps this change governable: Strategy defines value, Orchestration governs the workflow, Execution produces the Increment, and Assurance verifies it. The single rule that holds the architecture together is that agents can be responsible for work, but only humans can be accountable for outcomes. Every later module, from the process loop to the risk register, builds on this distinction.",
  m1_terms: [
    { front: "Agentic AI", back: "AI systems that plan and execute multi-step tasks autonomously toward a goal, using tools with limited human intervention." },
    { front: "Execution Engine", back: "The part of the system that actually produces work; in Agentic AI Agile, the AI agents in L3." },
    { front: "Orchestration Layer (L2)", back: "The layer that designs, sequences and governs agent workflows and guardrails; owned by the PjM." },
    { front: "Assurance Layer (L4)", back: "The layer that verifies output against the Definition of Done and owns architecture and security; owned by System Architects." },
    { front: "Agent-to-Agent (A2A) Interaction", back: "Direct exchange between agents of different parties, such as a vendor's agent negotiating specifications with a client's agent." },

  m1_q: [

  m2_nav: "2. End-to-End Process",
  m2_title: "End-to-End Process: The Six-Stage Loop",
  m2_overview: "Value flows through six stages: Discover, Plan, Build, Verify, Release & Learn, and Improve. Each stage is specified as Input → Activities → Output → Gate, so that Scrum events and artifacts sit inside one continuous loop rather than in separate lists.",
  m2_highlights: ["Input → Activities → Output → Gate", "Six-Stage Loop", "Review Capacity", "Fail-back to Build", "Validated Learning"],
  m2_p1: "Stage 1, Discover, starts from customer needs, market signals and telemetry from the previous cycle. Agents analyse markets, translate ambiguous feedback into specifications and negotiate with client-side agents, while humans validate value hypotheses with real customers. The output is an ordered Product Backlog, gated by a Product Goal owned by the PM.",
  m2_p2: "Stage 2, Plan, corresponds to Sprint Planning. Agents propose decomposition and sequencing; humans decide scope. Because review capacity, not coding capacity, becomes the bottleneck, story-point velocity must be recalibrated. The gate is a Sprint Goal agreed by the Scrum Team.",
  m2_p3: "Stage 3, Build, runs within the Sprint. Agents generate, test and repair code inside guardrails set by the PjM and publish progress digests asynchronously. The fifteen-minute Daily Scrum remains, but it inspects progress toward the Sprint Goal and resolves blockers rather than collecting status reports. Stage 4, Verify, combines automated scans with human architecture and security review. Only an Increment that meets the Definition of Done passes; anything else returns to Build.",
  m2_p4: "Stage 5, Release & Learn, merges the Sprint Review with the MVP loop: the Increment is released, telemetry is monitored around the clock, and the PM inspects results with stakeholders to confirm, pivot or drop the hypothesis. Stage 6, Improve, is the Retrospective, recalibrating guardrails, the DoD and psychological safety. Its output feeds the next Discover stage, closing the loop.",
  m2_p5: "Reading the loop as a process also reveals where time is really spent. In agentic teams, work rarely waits in Build; it waits in queues before Verify and before stakeholder decisions in Release & Learn. Managers should therefore measure flow across the whole loop, including review wait time and the rate of fail-backs from Verify to Build, rather than celebrating faster code generation. A rising fail-back rate is an early warning that guardrails, specifications or the DoD need attention.",
  m2_wrapup: "The six-stage loop turns a collection of Scrum events and artifacts into a single process with defined inputs, activities, outputs and gates. Two features distinguish it from a conventional Scrum cycle. First, planning is based on human review capacity, because agents remove coding as the constraint. Second, Verify is an explicit stage with a fail-back path, so speed in Build never bypasses quality. The loop closes when telemetry and retrospective improvements from Stages 5 and 6 feed the next Discover stage, making learning cumulative rather than episodic.",
  m2_terms: [
    { front: "Stage Gate", back: "A decision point at the end of a stage that determines whether work proceeds, is reworked or is stopped." },
    { front: "Review Capacity", back: "The volume of agent output that humans can meaningfully review and approve within a period; the new bottleneck." },
    { front: "Candidate Increment", back: "Agent-built output from Stage 3 that has not yet passed the Definition of Done." },
    { front: "Done Increment", back: "An Increment that meets the Definition of Done and may be released." },
    { front: "Progress Digest", back: "An asynchronous, agent-generated summary of work status that replaces verbal status reporting." },
    { front: "Validated Learning", back: "Evidence about customers obtained by testing a hypothesis with real users (Build–Measure–Learn)." }
  ],
  m2_q: [
    { q: "A team's agents produce three times more code per Sprint, yet the team keeps missing its Sprint Goals while reviews pile up. What is the most likely cause?", opts: ["Agents are writing deliberately low-quality code", "Planning ignores review capacity, which has become the bottleneck", "The Sprint length is too long", "The Product Goal is unclear"], ans: _A1, exp: "When agents remove coding as the constraint, human review becomes the bottleneck. Planning must be based on review capacity." },
    { q: "Which statement about the Daily Scrum in Stage 3 is correct?", opts: ["It is abolished because agents publish digests", "It becomes a status reporting session for agents", "It remains a 15-minute event to inspect progress toward the Sprint Goal and resolve blockers", "It is replaced by the Sprint Review"], ans: _A2, exp: "Digests handle visibility; the Daily Scrum keeps its purpose of inspecting progress toward the Sprint Goal." },
    { q: "A Candidate Increment passes automated tests but fails the human security review. What happens next?", opts: ["It returns to Stage 3 Build", "It is released with a warning label", "It skips to Stage 6 Improve", "It is accepted because automated tests passed"], ans: _A0, exp: "Only an Increment that meets the DoD passes Verify; anything else fails back to Build." },
    { q: "In Stage 5, telemetry shows that users ignore the new feature. Which gate decision fits the MVP logic?", opts: ["Confirm, because the feature was delivered on time", "Return the Increment to Verify", "Extend the Sprint", "Pivot or drop the hypothesis and update the Product Backlog"], ans: _A3, exp: "Release & Learn tests a hypothesis. Evidence against it calls for a pivot or drop decision." },
    { q: "What closes the six-stage loop?", opts: ["The Sprint Review approves the budget", "The PjM signs off the Done Increment", "Outputs from Stages 5 and 6 (telemetry, improvements) feed Stage 1 Discover", "Agents automatically start a new Sprint"], ans: _A2, exp: "Telemetry and retrospective improvements become inputs to the next Discover stage." },
    { q: "Why is each stage specified as Input → Activities → Output → Gate?", opts: ["To make handoffs, responsibilities and control points explicit and traceable", "To make Scrum events longer", "To replace the Scrum Guide", "To reduce the number of stages"], ans: _A0, exp: "The specification makes the process traceable: what enters, what happens, what leaves and who decides." }
  ],

  m3_nav: "3. Accountability",
  m3_title: "Accountability: External PM, Internal PjM and RACI",
  m3_overview: "When agents perform most of the work, the critical management question becomes who answers for outcomes. This module maps Scrum accountabilities to an external PM, an internal PjM and System Architects, and uses a RACI matrix to assign exactly one human accountable owner to each stage.",
  m3_highlights: ["RACI", "One Human A per Stage", "PM: External Value", "PjM: Internal Process", "Authority to Serve"],
  m3_p1: "The RACI matrix distinguishes four relationships: Responsible (does the work), Accountable (answers for the outcome), Consulted and Informed. The framework imposes two rules: each stage has exactly one human A, and agents may be R but never A. Accountability cannot be delegated to a system that cannot be held to account.",
  m3_p2: "The Product Owner is reframed as an external-facing Product Manager. The PM owns market value, business strategy and the Product Goal, and is accountable for Discover, Plan and Release & Learn. Agents can analyse markets and draft backlog items, but value accountability is non-delegable.",
  m3_p3: "The Scrum Master is reframed as an internal Process Project Manager. This deliberately departs from the Scrum Guide 2020, which has no project-manager role. The author's position is that a Scrum Master without authority cannot effectively serve: in agentic workflows, someone must hold explicit authority over agent guardrails, the internal workflow and cross-departmental bottlenecks. The PjM is accountable for Build and Improve, and remains responsible for fostering psychological safety.",
  m3_p4: "Developers become System Architects. They own architecture, security and compliance with the Definition of Done, and are accountable for Verify. Their work shifts from hand-writing code to designing structures and reviewing agent output, which raises a long-term concern: junior developers lose the hands-on path through which architectural judgement is traditionally built.",
  m3_p5: "Clear accountability also changes how incidents are handled. When an agent causes a defect, the question is not which agent made the mistake but which accountable human owned the stage and its controls. This prevents blame from dissolving into the system. It also protects psychological safety: people can report agent failures openly because the RACI matrix specifies who decides and who fixes, rather than leaving the team to argue over responsibility after the fact. Accountability, in this sense, is a design choice made before work begins.",
  m3_wrapup: "Agentic AI Agile reallocates accountability rather than removing it. The PM faces outward and answers for value; the PjM faces inward and answers for the workflow and its guardrails; System Architects answer for whether the Increment is truly done. The RACI matrix enforces the principle that every stage has one human who can be held to account, while agents carry much of the responsibility for execution. The PjM reframing is a conscious departure from the Scrum Guide, justified by the view that service without authority is ineffective when machines execute most of the work.",
  m3_terms: [
    { front: "RACI", back: "A responsibility matrix: Responsible, Accountable, Consulted, Informed." },
    { front: "Accountable (A)", back: "The single person who answers for the outcome of a stage; always a human in this framework." },
    { front: "Responsible (R)", back: "Those who perform the work; agents may hold this role." },
    { front: "Product Manager (PM, external)", back: "Reframed Product Owner who owns market value, strategy and the Product Goal." },
    { front: "Process Project Manager (PjM, internal)", back: "Reframed Scrum Master with explicit authority over the internal workflow and agent guardrails (author's position)." },
    { front: "System Architect", back: "Reframed Developer who owns architecture, security and DoD compliance, reviewing rather than hand-writing code." }
  ],
  m3_q: [
    { q: "Which RACI assignment violates the framework's rules?", opts: ["Stage 3: PjM = A, agents = R", "Stage 4: Architects = A/R, agents = R", "Stage 1: agents = A, PM = R", "Stage 6: PjM = A, PM = C"], ans: _A2, exp: "Agents may be R but never A. Each stage needs exactly one human A." },
    { q: "Why does the framework reframe the Scrum Master as a PjM?", opts: ["Because the Scrum Guide 2020 requires a project manager", "Because service without explicit authority over guardrails and workflow is ineffective in agentic systems", "To reduce the PM's workload", "To let agents report to a single person"], ans: _A1, exp: "The author's position: a role without authority cannot effectively serve a system in which machines execute most of the work." },
    { q: "A market-analysis agent recommends dropping a feature valued by a key client segment. Who is accountable for the final decision?", opts: ["The market-analysis agent", "The PjM", "The client's agent", "The PM"], ans: _A3, exp: "Value decisions belong to the PM, who is accountable for Discover and the Product Goal." },
    { q: "Agents in Build keep exceeding API cost limits, and two departments dispute who should approve a higher budget. Who should act as the accountable owner?", opts: ["The PjM", "The PM", "System Architects", "The agents' vendor"], ans: _A0, exp: "The PjM is accountable for Build and holds authority over guardrails and cross-departmental bottlenecks." },
    { q: "Which long-term risk is associated with Developers becoming System Architects?", opts: ["Excess hand-written code", "Loss of the Product Goal", "Erosion of the junior talent pipeline", "Longer Daily Scrums"], ans: _A2, exp: "When entry-level coding is automated, juniors lose the path through which architectural judgement is built." },
    { q: "A critic says the PjM reframing contradicts the Scrum Guide. Which response is most defensible?", opts: ["The Scrum Guide has been withdrawn", "It is an explicit, reasoned departure, labelled as the author's position and justified by the authority needed to govern agents", "The PjM is identical to a traditional project manager", "The Scrum Master role no longer exists in any form"], ans: _A1, exp: "A defensible departure is transparent about what it changes and why." }
  ],

  m4_nav: "4. Control Gates",
  m4_title: "Control Gates: Artifacts and Commitments",
  m4_overview: "Each Scrum artifact carries one commitment, and in this framework each commitment functions as a control gate: the Product Goal controls direction, the Sprint Goal controls focus, and the Definition of Done controls quality.",
  m4_highlights: ["G1 Direction: Product Goal", "G2 Focus: Sprint Goal", "G3 Quality: Definition of Done", "AI-specific Checks", "Code Provenance"],
  m4_p1: "The Scrum Guide 2020 pairs each artifact with a commitment: the Product Backlog with the Product Goal, the Sprint Backlog with the Sprint Goal, and the Increment with the Definition of Done. Commitments make artifacts transparent and give the team something to inspect against. In an agentic workflow, they also become the points where human judgement constrains machine activity.",
  m4_p2: "G1, Direction, sits at the end of Discover. Agents can generate and reorder backlog items continuously, but without a Product Goal they optimise for whatever signal is easiest to measure. The PM-owned Product Goal anchors all agent prioritisation.",
  m4_p3: "G2, Focus, spans Plan and Build. Agents decompose work efficiently, yet they tend to optimise local tasks. The Sprint Goal gives the Sprint a single coherent objective, and it is the test applied in every Daily Scrum: is the goal still achievable, and if not, what scope must be renegotiated with the PM?",
  m4_p4: "G3, Quality, is the most critical gate. Because agents can produce large volumes of plausible but flawed output, the Definition of Done must explicitly include AI-specific checks: security scanning, test coverage thresholds, provenance tracing of generated code and dependencies, and a human review sign-off. A weak DoD converts higher throughput directly into higher instability.",
  m4_p5: "Gates also need owners and evidence. G1 is owned by the PM and evidenced by a written Product Goal that agents can reference. G2 is agreed by the Scrum Team and tested daily. G3 is owned by System Architects and evidenced by scan reports, test results, provenance records and a named sign-off. A gate without an owner becomes a formality, and a gate without evidence becomes an opinion. In agentic workflows, where output volume is high, both conditions are necessary for a gate to slow work down only when it should.",
  m4_wrapup: "Control gates convert Scrum's commitments into enforceable checkpoints. G1 keeps agent prioritisation pointed at a strategic objective, G2 keeps the Sprint coherent despite agents' tendency to optimise locally, and G3 decides whether output is genuinely done. Of the three, the Definition of Done carries the greatest weight in an agentic system, because it is the last place where human judgement can stop fast but flawed output from reaching users. Strengthening the DoD with AI-specific checks is therefore the most effective quality investment a team can make.",
  m4_terms: [
    { front: "Commitment", back: "The element paired with each Scrum artifact that provides a target for inspection and transparency." },
    { front: "Product Goal", back: "The long-term objective of the product; commitment of the Product Backlog and gate G1." },
    { front: "Sprint Goal", back: "The single objective of a Sprint; commitment of the Sprint Backlog and gate G2." },
    { front: "Definition of Done (DoD)", back: "The formal quality standard an Increment must meet; commitment of the Increment and gate G3." },
    { front: "Code Provenance", back: "Traceability of where generated code and its dependencies came from, including licences and sources." },
    { front: "Human Sign-off", back: "An explicit approval by an accountable human before an Increment is considered done." }
  ],
  m4_q: [
    { q: "Which pairing of artifact and commitment is correct?", opts: ["Sprint Backlog – Product Goal", "Increment – Definition of Done", "Product Backlog – Sprint Goal", "Increment – Sprint Goal"], ans: _A1, exp: "Product Backlog–Product Goal, Sprint Backlog–Sprint Goal, Increment–Definition of Done." },
    { q: "Backlog agents keep promoting items that maximise click-through rather than strategic value. Which gate is missing or weak?", opts: ["G1 Product Goal", "G2 Sprint Goal", "G3 Definition of Done", "None; this is normal agent behaviour"], ans: _A0, exp: "Without a Product Goal, agents optimise for the easiest measurable signal." },
    { q: "Which item is NOT one of the proposed AI-specific DoD checks?", opts: ["Security scanning", "Code provenance tracing", "Human review sign-off", "The number of agents used"], ans: _A3, exp: "The DoD checks quality and traceability, not how many agents were involved." },
    { q: "Midway through a Sprint, agents report that an external API change makes the Sprint Goal unattainable. What should happen?", opts: ["Agents silently redefine the Sprint Goal", "The Sprint is automatically extended", "Developers renegotiate scope with the PM while keeping the Sprint coherent", "The DoD is relaxed"], ans: _A2, exp: "The Sprint Goal is tested at each Daily Scrum; if unattainable, scope is renegotiated with the PM." },
    { q: "Why is G3 considered the most critical gate in agentic workflows?", opts: ["It is the first gate in the process", "It is the last point where human judgement can stop fast but flawed output from reaching users", "It is owned by the client", "It replaces the Sprint Review"], ans: _A1, exp: "G3 is the final quality barrier before release." },
    { q: "A team increases throughput but keeps a DoD written for human-only coding. What is the likely outcome?", opts: ["Higher stability", "Lower throughput", "No effect", "Throughput converts into instability"], ans: _A3, exp: "A weak DoD converts higher throughput directly into higher instability." }
  ],

  m5_nav: "5. Four Dimensions",
  m5_title: "Four Dimensions and Traceability",
  m5_overview: "The author's four dimensions—Customer, Development, MVP and Organization—describe where Agentic AI changes Agile. This module traces each dimension to an Agile Manifesto value, a process stage and specific Scrum elements, and distinguishes the framework from Scrum's three empirical pillars.",
  m5_highlights: ["Customer Collaboration", "Progressive Iteration", "MVP Feedback Loop", "Cross-domain Integration", "Traceability"],
  m5_p1: "The four dimensions are an analytical framework, not a restatement of Scrum's three empirical pillars of Transparency, Inspection and Adaptation. Their value lies in traceability: each dimension links a Manifesto value to a stage of the loop and to concrete Scrum elements, so that a change in one place can be followed through the system.",
  m5_p2: "Customer: Interactive Collaboration traces to 'customer collaboration over contract negotiation' and to Stage 1. Agents act as virtual analysts and increasingly negotiate with client-side agents. Development: Progressive Iteration traces to 'working software over comprehensive documentation' and to Stages 2–4; cycle time falls sharply, but gains are bounded by review capacity and delivery stability.",
  m5_p3: "MVP: Feedback Loop traces to 'responding to change over following a plan' and to Stage 5. Agents assemble prototypes quickly and monitor telemetry around the clock, but the MVP remains a vehicle for validated learning, not a demonstration. A prototype without a measurable hypothesis and real users is not an MVP.",
  m5_p4: "Organization: Cross-domain Integration traces to 'individuals and interactions over processes and tools' and to Stage 6, while cutting across the whole loop. Multi-agent systems can translate between domains and align knowledge bases, but silos rooted in incentives and authority still require human governance; information alone does not dissolve them.",
  m5_p5: "Traceability is most useful when something changes. Suppose a client deploys its own negotiation agent. The Customer dimension shows that Stage 1 is affected; the matrix then points to the Product Backlog and Backlog Refinement as the Scrum elements to adjust, and to human value validation as the safeguard. The same reasoning works in reverse: a rising fail-back rate in Verify traces to the Development dimension and the DoD. The four dimensions thus turn strategic observations into specific process decisions.",
  m5_wrapup: "The four dimensions explain where Agentic AI changes Agile, and the traceability matrix explains how those changes connect. Customer collaboration becomes partly agent-to-agent, development accelerates within the limits of review capacity, the MVP loop runs continuously but still depends on validated learning, and cross-domain integration benefits from agents but remains a matter of incentives and governance. Keeping the dimensions distinct from Scrum's empirical pillars prevents conceptual confusion and makes the framework's own contribution clear.",
  m5_terms: [
    { front: "Four Dimensions", back: "The author's framework: Customer, Development, MVP and Organization." },
    { front: "Empirical Pillars", back: "Scrum's three pillars: Transparency, Inspection and Adaptation." },
    { front: "Agile Manifesto Values", back: "Four value statements of 2001, e.g. 'responding to change over following a plan'." },
    { front: "Traceability Matrix", back: "A table linking each dimension to a value, a stage and Scrum elements." },
    { front: "Minimum Viable Product (MVP)", back: "The smallest product that tests a hypothesis with real users to generate validated learning." },
    { front: "Organizational Silo", back: "A unit that does not share information or goals with others, often due to incentives and authority structures." }
  ],
  m5_q: [
    { q: "Which statement correctly distinguishes the four dimensions from Scrum's pillars?", opts: ["They are the same concepts renamed", "Scrum has three empirical pillars (Transparency, Inspection, Adaptation); the four dimensions are the author's analytical framework", "Scrum has four pillars matching the dimensions", "The dimensions replace the Agile Manifesto"], ans: _A1, exp: "The four dimensions are an analytical framework and should not be confused with Scrum's three pillars." },
    { q: "Which Manifesto value does the MVP dimension trace to?", opts: ["Customer collaboration over contract negotiation", "Working software over comprehensive documentation", "Responding to change over following a plan", "Individuals and interactions over processes and tools"], ans: _A2, exp: "The MVP loop is about learning and adapting, which maps to responding to change." },
    { q: "A team demonstrates an agent-built prototype to executives and calls it an MVP. What is missing?", opts: ["A measurable hypothesis tested with real users", "A larger budget", "More features", "A longer Sprint"], ans: _A0, exp: "An MVP generates validated learning; a demo without a hypothesis and real users does not." },
    { q: "Why can multi-agent translation not fully dissolve organizational silos?", opts: ["Agents cannot read documents", "Silos only exist in small firms", "Translation is too slow", "Silos are often rooted in incentives and authority, which require human governance"], ans: _A3, exp: "Information alignment helps, but incentive and authority structures need human governance." },
    { q: "Which stages does the Development dimension primarily trace to?", opts: ["Stage 1", "Stages 2–4", "Stage 5", "Stage 6"], ans: _A1, exp: "Development spans Plan, Build and Verify." },
    { q: "A client's agent negotiates requirements with your agent. Which dimension and safeguard apply?", opts: ["Organization; agents decide the scope", "MVP; telemetry replaces negotiation", "Customer; humans retain value validation", "Development; the DoD governs negotiation"], ans: _A2, exp: "Agent-to-agent negotiation belongs to the Customer dimension, with humans validating value." }
  ],

  m6_nav: "6. Risks by Stage",
  m6_title: "Risks by Stage: Mapping Risks to Controls",
  m6_overview: "Every stage of the loop introduces a characteristic risk when agents take over execution. This module maps six risks to their stages and pairs each with a control, so that risk management becomes part of the process rather than an afterthought.",
  m6_highlights: ["Synthetic Feedback", "Velocity Distortion", "Guardrail Breach", "Throughput vs Stability", "Talent Pipeline"],
  m6_p1: "In Discover, the risk is that synthetic feedback from simulated personas replaces real customers. The control is human validation of value hypotheses. In Plan, story-point velocity loses meaning once agents write the code, because points were calibrated on human effort; the control is to plan by review capacity.",
  m6_p2: "In Build, agents may act outside their guardrails, touching systems, data or budgets beyond their scope. The control is PjM-owned guardrails combined with audit logs that make every agent action traceable.",
  m6_p3: "In Verify, higher throughput can come with lower stability and insecure code. Industry research on AI-assisted development reports this pattern: more output, but more instability unless review and platform capabilities keep pace. The control is a DoD with AI-specific checks. In Release & Learn, a prototype may be mistaken for an MVP; the control is to require a measurable hypothesis.",
  m6_p4: "In Improve, the risk is slower and less visible: the junior talent pipeline erodes because entry-level work is automated. The control is to design learning roles into review deliberately, for example by pairing junior developers with architects on agent-output review, so that judgement continues to be built.",
  m6_p5: "Treating these risks as a register rather than a checklist matters. Severity differs across stages and changes over time: instability in Verify tends to be acute and visible, while talent erosion in Improve is gradual and easy to ignore until senior expertise runs short. Managers should therefore review the register in every Retrospective, assign each risk to the accountable owner of its stage, and track leading indicators such as review wait time, fail-back rate, guardrail incidents and the share of review work done by junior staff. Risk management in an agentic workflow is continuous, not a one-time assessment.",
  m6_wrapup: "Mapping risks to stages turns risk management into a design feature of the loop. Each risk arises where agents change the nature of work: simulated customers in Discover, distorted metrics in Plan, scope violations in Build, instability in Verify, false MVPs in Release & Learn, and an eroding talent pipeline in Improve. Each control relies on the principle established in Module 1: agents execute, while humans judge and remain accountable. A manager who can name the risk and control for every stage can govern an agentic workflow rather than merely deploy one.",
  m6_terms: [
    { front: "Synthetic Feedback", back: "Feedback generated by simulated users or personas rather than real customers." },
    { front: "Velocity Distortion", back: "Loss of meaning in story-point velocity when the effort it was calibrated on is no longer the constraint." },
    { front: "Guardrail", back: "A rule or limit that constrains what an agent may access, change or spend." },
    { front: "Audit Log", back: "A traceable record of every agent action, used for accountability and incident analysis." },
    { front: "Delivery Stability", back: "How reliably changes reach production without failures or rollbacks." },
    { front: "Talent Pipeline", back: "The pathway through which junior staff develop into senior experts." }
  ],
  m6_q: [
    { q: "Which control matches the Build-stage risk of agents exceeding their scope?", opts: ["Human validation of hypotheses", "PjM-owned guardrails with audit logs", "Planning by review capacity", "Measurable hypotheses"], ans: _A1, exp: "Guardrails prevent scope violations; audit logs make agent actions traceable." },
    { q: "A product team relies on simulated user personas to approve features. Which stage risk is this?", opts: ["Discover: synthetic feedback replaces real customers", "Plan: velocity distortion", "Verify: insecure code", "Improve: talent erosion"], ans: _A0, exp: "Simulated personas cannot replace validation with real customers." },
    { q: "Industry research on AI-assisted development most consistently reports which pattern?", opts: ["Lower throughput and higher stability", "No measurable effect", "Fewer deployments", "Higher throughput, with instability rising unless review and platform capabilities keep pace"], ans: _A3, exp: "Gains in output can come with instability unless review and platform capabilities keep up." },
    { q: "Which response best addresses talent pipeline erosion?", opts: ["Hire only senior architects", "Ban agents from simple tasks", "Design learning roles into review, such as pairing juniors with architects", "Extend the Sprint length"], ans: _A2, exp: "Deliberate learning roles preserve the development of judgement." },
    { q: "Why is velocity distorted when agents write code?", opts: ["Story points were calibrated on human coding effort, which no longer reflects the true constraint", "Agents refuse to estimate", "Velocity is required by the Scrum Guide", "Sprints become longer"], ans: _A0, exp: "The constraint has moved to review capacity, so effort-based points lose meaning." },
    { q: "Which principle underlies all six controls?", opts: ["Agents should be accountable for their output", "Agents execute; humans judge and remain accountable", "Risk management belongs only in the Retrospective", "Clients should own risk"], ans: _A1, exp: "Every control keeps human judgement and accountability in the loop." }
  ],

  : { pri: '#004030', sec: '#D8C3A5', text: '#1f2937', card: '#ffffff', mute: '#64748b', line: '#cbd5e1', soft: '#e7efec', red: '#b91c1c' };
const guard = (e) => { e.preventDefault(); window.showCopyrightToast && window.showCopyrightToast(); };

const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const startIdx = groupIdx * groupSize;
  const currentCardIndices = shuffledOrder.slice(startIdx, startIdx + groupSize);

  useEffect(() => {
    const newShown = new Set(shownSet);
    currentCardIndices.forEach(idx => newShown.add(idx));
    if (newShown.size !== shownSet.size) setShownSet(newShown);
  }, [groupIdx]);

  const handleFlip = (origIdx) => {
    setFlipped(f => ({ ...f, [origIdx]: !f[origIdx] }));
    if (!readSet.has(origIdx)) {
      const newRead = new Set(readSet); newRead.add(origIdx); setReadSet(newRead);
      if (onCardRead) onCardRead(moduleId, newRead.size, shownSet.size, terms.length);
    }
  };
  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);

  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map((origIdx) => {
          const term = terms[origIdx];
          return (
            <div key={origIdx} className="perspective cursor-pointer h-40" onClick={() => handleFlip(origIdx)}>
              <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[origIdx] ? 'rotate-y-180' : ''}`}>
                <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                  <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{term.front}</p>
                  <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
                </div>
                <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center">
                  <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{term.back}</p>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }}
          className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">{t.flip_retry}</button>
        <button onClick={() => groupIdx < totalGroups - 1 && setGroupIdx(groupIdx + 1)} disabled={groupIdx >= totalGroups - 1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>
      </div>
    </div>
  );
};

const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit, moduleName }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [quizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const [shuffledMaps] = useState(() => quizIndices.map(qIdx => [...Array(questions[qIdx].opts.length).keys()].sort(() => Math.random() - 0.5)));

  const totalAnswered = Object.keys(selected).length;
  const computeCorrect = () => {
    let c = 0;
    quizIndices.forEach((qIdx, qi) => {
      if (selected[qi] === undefined) return;
      if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++;
    });
    return c;
  };
  const statusText = t.quiz_status.replace('{correct}', computeCorrect()).replace('{answered}', totalAnswered).replace('{total}', quizIndices.length);
  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);

  const handleGroupSubmit = () => {
    const allDone = currentIndices.every((_, i) => selected[currentStart + i] !== undefined);
    if (!allDone) return;
    setSubmitted(s => ({ ...s, [groupIdx]: true }));
    // 每組提交即回報（部分作答也計入）：答對 / 已答 / 總題數
    const wrongQs = []; let correct = 0; let answered = 0;
    quizIndices.forEach((qIdx, qi) => {
      if (selected[qi] === undefined) return;
      answered++;
      if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++;
      else wrongQs.push(questions[qIdx].q);
    });
    onQuizSubmit(moduleId, correct, quizIndices.length, wrongQs, moduleName, answered);
  };

  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-4 sm:p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI;
        const q = questions[qIdx];
        const sMap = shuffledMaps[qi];
        const isGrpSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3 text-base">{qi + 1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans);
                const isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isGrpSub && setSelected(s => ({ ...s, [qi]: dIdx }))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm
                      ${isGrpSub
                        ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30'
                          : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                        : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5 dark:bg-[#D8C3A5]/10' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isGrpSub && (
              <p className={`mt-2 text-sm italic ${shuffledMaps[qi][selected[qi]] === _d(q.ans) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3 flex-wrap">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!currentIndices.every((_, i) => selected[currentStart + i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx < totalGroups - 1 && (
                <button onClick={() => setGroupIdx(groupIdx + 1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>
              )}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }}
                className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

        {pts.map((p, i) => { const q = pts[(i + 1) % 6]; const dx = q[0] - p[0], dy = q[1] - p[1], d = Math.hypot(dx, dy); const k = 48 / d;

              return <text x={x} y={sp.length > 1 ? 203 : 211} fontSize="11" fontWeight="600" textAnchor="middle" fill={P.pri}>{sp.map((l, k) => <tspan key={k} x={x} dy={k ? 14 : 0}>{l}</tspan>)}</text>; })()}

      </SvgWrap>

  return null;
};
